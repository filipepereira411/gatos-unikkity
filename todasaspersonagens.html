<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas as Personagens - Unikitty! & Unikingdom</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 45%, #a1c4fd 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #ff2e93;
      --secondary: #00b4d8;
      --text-dark: #2b2d42;
      --text-muted: #5c6378;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      max-width: 850px;
      margin: 0 auto 2rem;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 46, 147, 0.2);
      border: 4px solid #fff;
    }

    header h1 {
      font-size: 2.4rem;
      color: var(--primary);
      text-shadow: 2px 2px 0px #ffe5ec;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      max-width: 900px;
      margin: 0 auto 2.5rem;
    }

    .filter-btn {
      background: #fff;
      border: 3px solid var(--primary);
      color: var(--primary);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 46, 147, 0.35);
    }

    .search-box {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 2rem;
      display: block;
    }

    .search-box input {
      width: 100%;
      padding: 0.85rem 1.4rem;
      border-radius: 50px;
      border: 3px solid #fff;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.8rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 1.5rem;
      text-align: center;
      border: 4px solid #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 18px 35px rgba(255, 46, 147, 0.25);
    }

    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-heroi { background: #ffe5ec; color: #d90429; }
    .badge-vilao { background: #2b2d42; color: #ffd166; }
    .badge-secundario { background: #e0fbfc; color: #0077b6; }

    .avatar-box {
      width: 130px;
      height: 130px;
      margin: 0.5rem auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 40%, #f8f9fa 100%);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 1.45rem;
      margin-bottom: 0.3rem;
      color: var(--text-dark);
    }

    .role {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.2rem;
    }

    .sparkle-btn {
      background: linear-gradient(90deg, #ff2e93, #ff758f);
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      width: 100%;
    }

    .sparkle-btn:hover {
      opacity: 0.92;
    }

    .sparkle-btn:active {
      transform: scale(0.96);
    }

    .quote-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #2b2d42;
      color: #fff;
      padding: 1rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 3px solid #ffd166;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
      max-width: 90vw;
    }

    .quote-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      animation: floatUp 1.1s ease-out forwards;
      z-index: 999;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.4) rotate(25deg); }
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🦄🐱 Todas as Personagens de Unikitty!</h1>
    <p>Explora os habitantes do Reino Unikingdom, os seus aliados e os vilões de Frowntown!</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Pesquisar personagem ou característica...">
  </div>

  <div class="controls">
    <button class="filter-btn active" data-filter="todos">Todas (10)</button>
    <button class="filter-btn" data-filter="heroi">Castelo & Heróis</button>
    <button class="filter-btn" data-filter="vilao">Vilões de Frowntown</button>
    <button class="filter-btn" data-filter="secundario">Habitantes do Reino</button>
  </div>

  <main class="grid" id="charactersGrid"></main>

  <div class="quote-toast" id="quoteToast"></div>

  <footer>
    Reino Unikingdom • Feito com Matéria Brilhante ✨
  </footer>

        category: "heroi",

        desc: "Um bloco cinzento flutuante de 1x3 que adora limpezas, regras, organização e coisas extremamente aborrecidas, mas tem um coração de ouro.",

        emoji: "🧱",

        svg: `<svg viewBox="0 0 120 120" width="110" height="110">

        desc: "Um dos cidadãos mais expressivos do Unikingdom. Está sempre pronto para celebrar qualquer evento ou entrar em pânico dramático.",

        emoji: "🎈",
        svg: `<svg viewBox="0 0 120 120" width="110" height="110">
          <circle cx="60" cy="62" r="34" fill="#9b5de5"/>
          <circle cx="48" cy="54" r="6" fill="#fff"/>
          <circle cx="72" cy="54" r="6" fill="#fff"/>
          <circle cx="48" cy="54" r="3" fill="#1d1e2c"/>
          <circle cx="72" cy="54" r="3" fill="#1d1e2c"/>

    ];

    const grid = document.getElementById('charactersGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const toast = document.getElementById('quoteToast');

    let currentFilter = 'todos';
    let toastTimeout;

    function createParticles(x, y, emoji) {
      for (let i = 0; i < 6; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = i % 2 === 0 ? emoji : '✨';
        p.style.left = (x + (Math.random() * 80 - 40)) + 'px';
        p.style.top = (y + (Math.random() * 40 - 20)) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      }
    }

    function showQuote(quote) {
      toast.textContent = quote;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    function renderCards() {
      const term = searchInput.value.toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = characters.filter(c => {
        const matchesFilter = currentFilter === 'todos' || c.category === currentFilter;
        const matchesSearch = c.name.toLowerCase().includes(term) ||
                              c.role.toLowerCase().includes(term) ||
                              c.desc.toLowerCase().includes(term);
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; background:#fff; padding:2rem; border-radius:20px; font-weight:bold;">Nenhuma personagem encontrada com esse termo! 😿</div>`;
        return;
      }

      filtered.forEach(char => {
        const card = document.createElement('article');
        card.className = 'card';

        const badgeClass = char.category === 'heroi' ? 'badge-heroi' :
                           char.category === 'vilao' ? 'badge-vilao' : 'badge-secundario';

        card.innerHTML = `
          <span class="badge ${badgeClass}">${char.badge}</span>
          <div>
            <div class="avatar-box">${char.svg}</div>
            <h2>${char.name}</h2>
            <div class="role">${char.role}</div>
            <p class="desc">${char.desc}</p>
          </div>
          <button class="sparkle-btn">Ouvir Frase & Brilho ${char.emoji}</button>
        `;

        const btn = card.querySelector('.sparkle-btn');
        btn.addEventListener('click', (e) => {
          showQuote(char.quote);
          createParticles(e.clientX, e.clientY, char.emoji);
        });

        grid.appendChild(card);
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderCards();
      });
    });

    searchInput.addEventListener('input', renderCards);

    renderCards();
  </script>
</body>
</html>
